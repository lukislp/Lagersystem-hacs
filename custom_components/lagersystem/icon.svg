    <!-- Windows -->
    <rect x="70" y="110" width="20" height="20" fill="#667eea" rx="2"/>
    <rect x="100" y="110" width="20" height="20" fill="#667eea" rx="2"/>
    <rect x="136" y="110" width="20" height="20" fill="#667eea" rx="2"/>
    <rect x="166" y="110" width="20" height="20" fill="#667eea" rx="2"/>
    
    <!-- Boxes/Packages -->
    <rect x="70" y="170" width="30" height="25" fill="#4CAF50" rx="2"/>
 <rect x="156" y="170" width="30" height="25" fill="#FF9800" rx="2"/>
    
    <!-- Barcode on left box -->
    <line x1="75" y1="175" x2="75" y2="190" stroke="#333" stroke-width="1"/>
    <line x1="78" y1="175" x2="78" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="81" y1="175" x2="81" y2="190" stroke="#333" stroke-width="1"/>
    <line x1="84" y1="175" x2="84" y2="190" stroke="#333" stroke-width="2"/>
