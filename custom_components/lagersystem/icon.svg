    <line x1="90" y1="175" x2="90" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="93" y1="175" x2="93" y2="190" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Home Assistant Connection Icon -->
