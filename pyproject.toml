[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported (pytest-homeassistant README).
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Button presses and the connection test intentionally swallow any API failure
# (log it, keep the entity/flow usable) rather than letting an HTTP client's
# exception hierarchy crash a button press or fail config flow validation.
ignore = ["BLE001"]
